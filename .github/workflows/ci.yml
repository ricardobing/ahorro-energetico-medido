name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Verificar (Node ${{ matrix.node }})
    # Fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19/10/2026 y MongoDB embebido necesita un binario conocido.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run trace
      - run: npm run build
      - run: npm run test:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node${{ matrix.node }}
          path: playwright-report
